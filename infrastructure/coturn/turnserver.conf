# ==============================================================================
# VIRTUAL Coturn STUN & TURN Relay Server Configuration
# ==============================================================================

# Network interfaces and ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Min and max relay UDP ports for WebRTC media streams
min-port=49152
max-port=65535

# Server realm and identity
realm=turn.virtualcam.io
server-name=virtual-coturn

# Authentication mechanism
lt-cred-mech
fingerprint

# Long-term credential user accounts
# In production, integrate with TURN REST API or database secret
user=virtual_turn_user:virtual_turn_secret_auth_token_99

# Relay permissions
no-cli
no-loopback-peers
no-multicast-peers

# Logging
verbose
log-file=stdout
