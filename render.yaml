services:
  # 1. Node.js Backend & WebSockets Signaling Server
  - type: web
    name: virtual-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: STUN_SERVER_URL
        value: stun:stun.l.google.com:19302
      - key: CORS_ORIGIN
        value: "*"

databases:
  # 2. Managed PostgreSQL Database
  - name: virtual-db
    region: singapore
    plan: free
    databaseName: virtual_db
    user: virtual_user
