services:
  # 1. Node.js Backend & WebSockets Signaling Server
  - type: web
    name: virtual-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_d3FfThjcvaz2@ep-royal-wave-b491ugdv-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&connection_limit=20&pool_timeout=30&connect_timeout=30
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: STUN_SERVER_URL
        value: stun:stun.l.google.com:19302
      - key: CORS_ORIGIN
        value: "*"
